[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recomuse"
version = "0.1.0"
description = "Conversion de partitions PDF ou images en partitions numériques éditables (MusicXML, MuseScore, MIDI)."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Fanfare Royale d'Acoz" }]
dependencies = [
    "pywebview>=5.3",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
recomuse = "recomuse.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Le schéma SQL est un fichier de données livré avec le paquet.
"recomuse.storage" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests lents, lancés seulement sur demande :
#   pytest -m corpus    (vraies partitions du corpus local)
#   pytest -m external  (vrais Audiveris et Tesseract)
addopts = "-ra -m 'not corpus and not external'"
markers = [
    "corpus: tests sur les vraies partitions du corpus local (lecture seule)",
    "external: tests qui lancent les vrais Audiveris et Tesseract",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
# Outils de test locaux (tests/synthetic.py, tests/vector_builder.py), rangés après les imports du projet.
known-local-folder = ["synthetic", "vector_builder"]
